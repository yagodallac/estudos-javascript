<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo JS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ea9dfd;
            color: white;
            text-align: center;
            padding-top: 50px;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Bem-vindo ao aprendizado de JavaScript!</p>

    <script>
        var nome = prompt("Qual é o seu nome?");
        alert("Olá, " + nome + "! Bem-vindo ao aprendizado de JavaScript!");

        var num1 = Number(prompt("Digite o primeiro número:"));
        var num2 = Number(prompt("Digite o segundo número:"));
        var soma = num1 + num2;
        document.write(`A soma de ${num1} e ${num2} é: ${soma}`);
    </script>
</body>
</html>
